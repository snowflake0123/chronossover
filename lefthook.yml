pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,json,css,md}"
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
